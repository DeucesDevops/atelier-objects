{{- range $name, $svc := .Values.services }}
{{- $floor := include "atelier.floor" (dict "svc" $svc) | int }}
{{- if gt $floor 1 }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.namespace }}
  labels:
    {{- include "atelier.labels" (dict "root" $ "name" $name) | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "atelier.selector" (dict "name" $name) | nindent 6 }}
{{- end }}
{{- end }}
