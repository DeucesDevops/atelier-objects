{{- range $name, $svc := .Values.services }}
{{- if $svc.externalSecret }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.namespace }}
  labels:
    {{- include "atelier.labels" (dict "root" $ "name" $name) | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: {{ $name }}
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ $.Values.secretPrefix }}/{{ $name }}
{{- end }}
{{- end }}
