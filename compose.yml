name: commerce-platform

x-postgres: &postgres
  image: postgres:16-alpine
  environment: &postgres-env
    POSTGRES_USER: commerce
    POSTGRES_PASSWORD: commerce
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U commerce"]
    interval: 5s
    timeout: 3s
    retries: 20
  restart: unless-stopped

x-ts-service: &ts-service
  build:
    context: .
    dockerfile: services/Dockerfile.typescript
  restart: unless-stopped

services:
  auth-db:
    <<: *postgres
    environment: { <<: *postgres-env, POSTGRES_DB: auth }
    ports: ["5433:5432"]
    volumes: ["auth-data:/var/lib/postgresql/data"]
  catalog-db:
    <<: *postgres
    environment: { <<: *postgres-env, POSTGRES_DB: catalog }
    ports: ["5434:5432"]
    volumes: ["catalog-data:/var/lib/postgresql/data"]
  inventory-db:
    <<: *postgres
    environment: { <<: *postgres-env, POSTGRES_DB: inventory }
    ports: ["5435:5432"]
    volumes: ["inventory-data:/var/lib/postgresql/data"]
  order-db:
    <<: *postgres
    environment: { <<: *postgres-env, POSTGRES_DB: orders }
    ports: ["5436:5432"]
    volumes: ["order-data:/var/lib/postgresql/data"]
  payment-db:
    <<: *postgres
    environment: { <<: *postgres-env, POSTGRES_DB: payments }
    ports: ["5437:5432"]
    volumes: ["payment-data:/var/lib/postgresql/data"]
  analytics-db:
    <<: *postgres
    environment: { <<: *postgres-env, POSTGRES_DB: analytics }
    ports: ["5438:5432"]
    volumes: ["analytics-data:/var/lib/postgresql/data"]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.5
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports: ["19092:19092"]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 20

  auth-service:
    <<: *ts-service
    build: { context: ., dockerfile: services/Dockerfile.typescript, args: { SERVICE: auth-service } }
    environment:
      SERVICE_NAME: auth-service
      PORT: 3001
      DATABASE_URL: postgres://commerce:commerce@auth-db:5432/auth
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-me}
    depends_on:
      auth-db: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports: ["3001:3001"]

  catalog-service:
    <<: *ts-service
    build: { context: ., dockerfile: services/Dockerfile.typescript, args: { SERVICE: catalog-service } }
    environment:
      SERVICE_NAME: catalog-service
      PORT: 3002
      DATABASE_URL: postgres://commerce:commerce@catalog-db:5432/catalog
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: redpanda:9092
      SEED_DEMO: "true"
    depends_on:
      catalog-db: { condition: service_healthy }
      redis: { condition: service_healthy }
      redpanda: { condition: service_healthy }
    ports: ["3002:3002"]

  inventory-service:
    <<: *ts-service
    build: { context: ., dockerfile: services/Dockerfile.typescript, args: { SERVICE: inventory-service } }
    environment:
      SERVICE_NAME: inventory-service
      PORT: 3004
      DATABASE_URL: postgres://commerce:commerce@inventory-db:5432/inventory
      KAFKA_BROKERS: redpanda:9092
    depends_on:
      inventory-db: { condition: service_healthy }
      redpanda: { condition: service_healthy }
    ports: ["3004:3004"]

  payment-service:
    build: ./services/payment-service
    environment:
      PORT: 8085
      DATABASE_URL: jdbc:postgresql://payment-db:5432/payments
      DATABASE_USER: commerce
      DATABASE_PASSWORD: commerce
      KAFKA_BROKERS: redpanda:9092
    depends_on:
      payment-db: { condition: service_healthy }
      redpanda: { condition: service_healthy }
    ports: ["8085:8085"]
    restart: unless-stopped

  order-service:
    <<: *ts-service
    build: { context: ., dockerfile: services/Dockerfile.typescript, args: { SERVICE: order-service } }
    environment:
      SERVICE_NAME: order-service
      PORT: 3003
      DATABASE_URL: postgres://commerce:commerce@order-db:5432/orders
      INVENTORY_SERVICE_URL: http://inventory-service:3004
      PAYMENT_SERVICE_URL: http://payment-service:8085
      KAFKA_BROKERS: redpanda:9092
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-me}
    depends_on:
      order-db: { condition: service_healthy }
      inventory-service: { condition: service_started }
      payment-service: { condition: service_started }
    ports: ["3003:3003"]

  notification-service:
    build: { context: ., dockerfile: services/notification-service/Dockerfile }
    environment: { KAFKA_BROKERS: redpanda:9092 }
    depends_on:
      redpanda: { condition: service_healthy }
    ports: ["8001:8001"]
    restart: unless-stopped

  analytics-service:
    build: { context: ., dockerfile: services/analytics-service/Dockerfile }
    environment:
      DATABASE_URL: postgresql://commerce:commerce@analytics-db:5432/analytics
      KAFKA_BROKERS: redpanda:9092
    depends_on:
      analytics-db: { condition: service_healthy }
      redpanda: { condition: service_healthy }
    ports: ["8002:8002"]
    restart: unless-stopped

  api-gateway:
    <<: *ts-service
    build: { context: ., dockerfile: services/Dockerfile.typescript, args: { SERVICE: api-gateway } }
    environment:
      SERVICE_NAME: api-gateway
      PORT: 8080
      AUTH_SERVICE_URL: http://auth-service:3001
      CATALOG_SERVICE_URL: http://catalog-service:3002
      ORDER_SERVICE_URL: http://order-service:3003
      INVENTORY_SERVICE_URL: http://inventory-service:3004
      PAYMENT_SERVICE_URL: http://payment-service:8085
      NOTIFICATION_SERVICE_URL: http://notification-service:8001
      ANALYTICS_SERVICE_URL: http://analytics-service:8002
    depends_on:
      auth-service: { condition: service_started }
      catalog-service: { condition: service_started }
      order-service: { condition: service_started }
      notification-service: { condition: service_started }
      analytics-service: { condition: service_started }
    ports: ["8080:8080"]

  web-app:
    build: { context: ., dockerfile: services/web-app/Dockerfile }
    environment:
      VITE_API_URL: http://localhost:8080
    depends_on:
      api-gateway: { condition: service_started }
    ports: ["5173:5173"]
    restart: unless-stopped

volumes:
  auth-data:
  catalog-data:
  inventory-data:
  order-data:
  payment-data:
  analytics-data:
