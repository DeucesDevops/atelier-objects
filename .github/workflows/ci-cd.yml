name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: commerce-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and compile
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/*/requirements.txt
      - name: Install dependencies
        run: make install
      - name: Validate configuration and scripts
        run: make validate
      - name: Run unit tests
        run: make test
      - name: Compile application artifacts
        run: npm run build && mvn -B -f services/payment-service/pom.xml -DskipTests package

  smoke:
    name: Build images and run checkout smoke test
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Exercise the complete stack
        run: make smoke

  deploy:
    name: Deploy to EC2
    needs: smoke
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.ENABLE_EC2_DEPLOYMENT == 'true'
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          install -m 600 /dev/null ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Upload release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          tar --exclude=.git --exclude=.env --exclude=node_modules --exclude=screenshots -czf /tmp/commerce-platform.tgz .
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" 'sudo install -d -o "$USER" -g "$USER" /opt/commerce-platform/current'
          scp -i ~/.ssh/deploy_key /tmp/commerce-platform.tgz "$DEPLOY_USER@$DEPLOY_HOST:/tmp/commerce-platform.tgz"
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" 'tar -xzf /tmp/commerce-platform.tgz -C /opt/commerce-platform/current && rm /tmp/commerce-platform.tgz'
      - name: Start release and verify health
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: |
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "cd /opt/commerce-platform/current && VITE_API_URL='$VITE_API_URL' ./scripts/deploy-compose.sh"
          curl --fail --retry 12 --retry-delay 10 --retry-all-errors "$VITE_API_URL/health"
