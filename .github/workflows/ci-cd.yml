name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: commerce-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and compile
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/*/requirements.txt
      - name: Install dependencies
        run: make install
      - name: Validate configuration and scripts
        run: make validate
      - name: Run unit tests
        run: make test
      - name: Compile application artifacts
        run: npm run build && mvn -B -f services/payment-service/pom.xml -DskipTests package

  smoke:
    name: Build images and run checkout smoke test
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Exercise the complete stack
        run: make smoke

  publish:
    name: Publish ${{ matrix.service }} image
    needs: smoke
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: auth-service
            context: .
            dockerfile: services/Dockerfile.typescript
            build-args: SERVICE=auth-service
          - service: catalog-service
            context: .
            dockerfile: services/Dockerfile.typescript
            build-args: SERVICE=catalog-service
          - service: inventory-service
            context: .
            dockerfile: services/Dockerfile.typescript
            build-args: SERVICE=inventory-service
          - service: order-service
            context: .
            dockerfile: services/Dockerfile.typescript
            build-args: SERVICE=order-service
          - service: api-gateway
            context: .
            dockerfile: services/Dockerfile.typescript
            build-args: SERVICE=api-gateway
          - service: payment-service
            context: services/payment-service
            dockerfile: services/payment-service/Dockerfile
            build-args: ''
          - service: notification-service
            context: .
            dockerfile: services/notification-service/Dockerfile
            build-args: ''
          - service: analytics-service
            context: .
            dockerfile: services/analytics-service/Dockerfile
            build-args: ''
          - service: web-app
            context: .
            dockerfile: services/web-app/Dockerfile
            build-args: ''
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Generate image tags
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/atelier-objects-${{ matrix.service }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: ${{ matrix.service == 'web-app' && format('VITE_API_URL={0}', secrets.VITE_API_URL) || matrix.build-args }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

 