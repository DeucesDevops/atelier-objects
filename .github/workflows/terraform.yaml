name: Terraform

on:
  pull_request:
  push:
    branches: [dev, main]

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - terraform/bootstrap
          - terraform/modules/network
          - terraform/modules/cluster
          - terraform/modules/ecr
          - terraform/modules/dns
          - terraform/modules/storage
          - terraform/modules/identity
          - terraform/modules/platform
          - terraform/environments/dev
          - terraform/environments/production
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.17.2"
          terraform_wrapper: false
      - name: Format
        working-directory: ${{ matrix.module }}
        run: terraform fmt -check -recursive
      - name: Init
        working-directory: ${{ matrix.module }}
        run: terraform init -backend=false -input=false -no-color
      - name: Validate
        working-directory: ${{ matrix.module }}
        run: terraform validate -no-color

  plan:
    name: plan ${{ matrix.environment }}
    needs: validate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, production]
    env:
      AWS_REGION: us-east-1
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.17.2"
          terraform_wrapper: false
      - name: Check AWS credentials
        id: creds
        env:
          AWS_TERRAFORM_ROLE_ARN: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          TF_DOMAIN: ${{ vars.TF_DOMAIN }}
        run: |
          if [ -z "${AWS_TERRAFORM_ROLE_ARN}" ] || [ -z "${TF_STATE_BUCKET}" ] || [ -z "${TF_DOMAIN}" ]; then
            echo "configured=false" >> "${GITHUB_OUTPUT}"
            echo "AWS role, state bucket, or TF_DOMAIN is unset; skipping plan."
          else
            echo "configured=true" >> "${GITHUB_OUTPUT}"
          fi
      - name: Configure AWS credentials
        if: steps.creds.outputs.configured == 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: terraform-plan-${{ matrix.environment }}
      - name: Plan
        if: steps.creds.outputs.configured == 'true'
        working-directory: terraform/environments/${{ matrix.environment }}
        env:
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          TF_DOMAIN: ${{ vars.TF_DOMAIN }}
          TF_VAR_github_repository: ${{ github.repository }}
        run: |
          set -euo pipefail
          terraform init -input=false -no-color \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=${{ matrix.environment }}/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="use_lockfile=true" \
            -backend-config="encrypt=true"
          terraform plan -input=false -no-color -lock-timeout=5m \
            -var="domain=${TF_DOMAIN}" \
            -var="github_repository=${TF_VAR_github_repository}"
