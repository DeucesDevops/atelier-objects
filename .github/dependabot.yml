version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  - package-ecosystem: maven
    directory: /services/payment-service
    schedule:
      interval: weekly

  - package-ecosystem: pip
    directory: /services/notification-service
    schedule:
      interval: weekly

  - package-ecosystem: pip
    directory: /services/analytics-service
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /services/payment-service
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /services/notification-service
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /services/analytics-service
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /services/web-app
    schedule:
      interval: weekly

  - package-ecosystem: terraform
    directory: /terraform/bootstrap
    schedule:
      interval: weekly

  - package-ecosystem: terraform
    directory: /terraform/modules/network
    schedule:
      interval: weekly

  - package-ecosystem: terraform
    directory: /terraform/modules/cluster
    schedule:
      interval: weekly

  - package-ecosystem: terraform
    directory: /terraform/modules/ecr
    schedule:
      interval: weekly

  - package-ecosystem: terraform
    directory: /terraform/modules/dns
    schedule:
      interval: weekly

  - package-ecosystem: terraform
    directory: /terraform/modules/storage
    schedule:
      interval: weekly

  - package-ecosystem: terraform
    directory: /terraform/modules/identity
    schedule:
      interval: weekly

  - package-ecosystem: terraform
    directory: /terraform/modules/platform
    schedule:
      interval: weekly

  - package-ecosystem: terraform
    directory: /terraform/environments/dev
    schedule:
      interval: weekly

  - package-ecosystem: terraform
    directory: /terraform/environments/production
    schedule:
      interval: weekly
