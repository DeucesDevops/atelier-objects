<text x="1375" y="463" dominant-baseline="text-before-edge" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#a7b8ce">NAT Gateway + IGW</text>
<text x="1375" y="491" dominant-baseline="text-before-edge" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#a7b8ce">Outbound private-node access</text>
<polyline points="950,305 950,405" fill="none" stroke="#71d6ff" stroke-width="3" stroke-linejoin="round"/>
<polygon points="950.0,405.0 944.3,393.3 955.7,393.3" fill="#71d6ff"/>
