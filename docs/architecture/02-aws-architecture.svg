<text x="625" y="253" dominant-baseline="text-before-edge" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#a7b8ce">DNS resolves the application domain; browser sends HTTPS</text>
<rect x="70" y="195" width="460" height="120" rx="14" fill="#111f33" stroke="#b79bff" stroke-width="2"/>
<rect x="85" y="214" width="4" height="26" rx="1" fill="#b79bff" stroke="#b79bff" stroke-width="2"/>
<text x="100" y="215" dominant-baseline="text-before-edge" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#f1f5f9">Supporting AWS resources</text>
<text x="95" y="253" dominant-baseline="text-before-edge" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#a7b8ce">ECR / Secrets Manager / IAM + OIDC</text>
<text x="95" y="281" dominant-baseline="text-before-edge" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#a7b8ce">State stores + etcd backups</text>
<rect x="45" y="345" width="1710" height="730" rx="18" fill="#0c1829" stroke="#334761" stroke-width="2"/>
<text x="67" y="363" dominant-baseline="text-before-edge" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" font-weight="700" fill="#a7b8ce">VPC  /  Public subnets across AZ A + AZ B; private compute + isolated data subnets</text>
<rect x="600" y="405" width="700" height="110" rx="14" fill="#111f33" stroke="#ffcc6b" stroke-width="2"/>
<rect x="615" y="424" width="4" height="26" rx="1" fill="#ffcc6b" stroke="#ffcc6b" stroke-width="2"/>
