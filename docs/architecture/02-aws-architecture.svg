<text x="105" y="620" dominant-baseline="text-before-edge" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#f1f5f9">Private control plane</text>
<text x="100" y="658" dominant-baseline="text-before-edge" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#a7b8ce">kOps-managed EC2 + etcd</text>
<text x="100" y="686" dominant-baseline="text-before-edge" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#a7b8ce">One node in AZ A for learning</text>
<text x="100" y="714" dominant-baseline="text-before-edge" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#a7b8ce">Restricted Kubernetes API access</text>
<rect x="535" y="600" width="1185" height="140" rx="14" fill="#111f33" stroke="#71d6ff" stroke-width="2"/>
<rect x="550" y="619" width="4" height="26" rx="1" fill="#71d6ff" stroke="#71d6ff" stroke-width="2"/>
<text x="565" y="620" dominant-baseline="text-before-edge" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#f1f5f9">Private workers · EC2 instance groups across AZ A + AZ B</text>
<text x="560" y="658" dominant-baseline="text-before-edge" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#a7b8ce">web + gateway + seven domain services; Redpanda StatefulSet → EBS PVC</text>
<text x="560" y="686" dominant-baseline="text-before-edge" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#a7b8ce">Application ALB sends HTTP to worker NodePort targets</text>
<text x="560" y="714" dominant-baseline="text-before-edge" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#a7b8ce">NAT provides outbound access; workers pull application images from ECR</text>
<polyline points="950,515 950,600" fill="none" stroke="#71d6ff" stroke-width="3" stroke-linejoin="round"/>
