<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200" role="img" aria-labelledby="title desc">
<title id="title">AWS architecture · kOps on EC2</title>
<desc id="desc">Proposed learning environment: two AZs for the network; one control-plane node; no high-availability claim. PROPOSED TARGET  |  Terraform owns AWS resources; cloud infrastructure is not deployed by this documentation.</desc>
<rect width="1800" height="1200" fill="#08111f"/>
<rect x="56" y="42" width="6" height="92" rx="0" fill="#71d6ff" stroke="#71d6ff" stroke-width="2"/>
<text x="82" y="44" dominant-baseline="text-before-edge" font-family="Arial,DejaVu Sans,sans-serif" font-size="16" font-weight="700" fill="#71d6ff">ATELIER OBJECTS  /  COMMERCE PLATFORM</text>
<text x="80" y="76" dominant-baseline="text-before-edge" font-family="Arial,DejaVu Sans,sans-serif" font-size="40" font-weight="700" fill="#f1f5f9">AWS architecture · kOps on EC2</text>
<text x="80" y="132" dominant-baseline="text-before-edge" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#a7b8ce">Proposed learning environment: two AZs for the network; one control-plane node; no high-availability claim</text>
