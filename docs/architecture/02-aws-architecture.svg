<text x="625" y="463" dominant-baseline="text-before-edge" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#a7b8ce">HTTPS :443  |  /api and /api/* → gateway  |  /* → web</text>
<rect x="1350" y="405" width="370" height="110" rx="14" fill="#111f33" stroke="#ffcc6b" stroke-width="2"/>
