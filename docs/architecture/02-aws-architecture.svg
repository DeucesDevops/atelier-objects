<text x="885" y="765" dominant-baseline="text-before-edge" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#7ee3bb">Application data connections</text>
<rect x="75" y="855" width="950" height="165" rx="14" fill="#111f33" stroke="#7ee3bb" stroke-width="2"/>
<rect x="90" y="874" width="4" height="26" rx="1" fill="#7ee3bb" stroke="#7ee3bb" stroke-width="2"/>
<text x="105" y="875" dominant-baseline="text-before-edge" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#f1f5f9">Private RDS PostgreSQL</text>
<text x="100" y="913" dominant-baseline="text-before-edge" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#a7b8ce">One instance; six logical databases and separate service users</text>
<text x="100" y="941" dominant-baseline="text-before-edge" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#a7b8ce">Backups + restore rehearsal; single-instance learning baseline</text>
<text x="100" y="969" dominant-baseline="text-before-edge" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#a7b8ce">Subnet group spans AZs; the instance is not automatically Multi-AZ</text>
<rect x="1080" y="855" width="640" height="165" rx="14" fill="#111f33" stroke="#7ee3bb" stroke-width="2"/>
<rect x="1095" y="874" width="4" height="26" rx="1" fill="#7ee3bb" stroke="#7ee3bb" stroke-width="2"/>
<text x="1110" y="875" dominant-baseline="text-before-edge" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#f1f5f9">Private ElastiCache Redis</text>
<text x="1105" y="913" dominant-baseline="text-before-edge" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#a7b8ce">Auth hints + catalog cache; single-node learning baseline</text>
<text x="1105" y="941" dominant-baseline="text-before-edge" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#a7b8ce">TLS/auth client setup must be implemented and tested</text>
<text x="1105" y="969" dominant-baseline="text-before-edge" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#a7b8ce">Separate secrets and data for each environment</text>
