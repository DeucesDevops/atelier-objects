<text x="675" y="253" dominant-baseline="text-before-edge" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#a7b8ce">/* → web NodePort Service → web pods :8080</text>
<text x="675" y="281" dominant-baseline="text-before-edge" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#a7b8ce">/api and /api/* → gateway NodePort Service → gateway pods :8080</text>
