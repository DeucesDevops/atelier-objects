<title id="title">Kubernetes cluster · kOps</title>
<desc id="desc">One application Helm chart; private EC2 workers; external PostgreSQL and Redis; in-cluster Redpanda. PROPOSED TARGET  |  Single control plane and single broker are deliberate learning limitations.</desc>
