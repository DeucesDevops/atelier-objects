<text x="1045" y="968" dominant-baseline="text-before-edge" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#a7b8ce">Event IDs deduplicate saved rows; rebuild depends on retained events</text>
