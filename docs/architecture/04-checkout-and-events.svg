<text x="70" y="1160" dominant-baseline="text-before-edge" font-family="Arial,DejaVu Sans,sans-serif" font-size="16" font-weight="400" fill="#a7b8ce">16 OCT 2026  |  Solid: request / data   Dashed: event / control   |  Details: docs/architecture/README.md</text>
<rect x="70" y="220" width="370" height="140" rx="14" fill="#111f33" stroke="#71d6ff" stroke-width="2"/>
<rect x="85" y="239" width="4" height="26" rx="1" fill="#71d6ff" stroke="#71d6ff" stroke-width="2"/>
<text x="100" y="240" dominant-baseline="text-before-edge" font-family="Arial,DejaVu Sans,sans-serif" font-size="24" font-weight="700" fill="#f1f5f9">1 · Create order</text>
<text x="95" y="278" dominant-baseline="text-before-edge" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#a7b8ce">Gateway → Orders</text>
<text x="95" y="306" dominant-baseline="text-before-edge" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#a7b8ce">Save PENDING to orders DB</text>
<rect x="500" y="220" width="370" height="140" rx="14" fill="#111f33" stroke="#71d6ff" stroke-width="2"/>
<rect x="515" y="239" width="4" height="26" rx="1" fill="#71d6ff" stroke="#71d6ff" stroke-width="2"/>
<text x="530" y="240" dominant-baseline="text-before-edge" font-family="Arial,DejaVu Sans,sans-serif" font-size="24" font-weight="700" fill="#f1f5f9">2 · Reserve stock</text>
<text x="525" y="278" dominant-baseline="text-before-edge" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#a7b8ce">Orders → Inventory</text>
<text x="525" y="306" dominant-baseline="text-before-edge" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#a7b8ce">Transactional reservation</text>
<rect x="930" y="220" width="370" height="140" rx="14" fill="#111f33" stroke="#71d6ff" stroke-width="2"/>
<rect x="945" y="239" width="4" height="26" rx="1" fill="#71d6ff" stroke="#71d6ff" stroke-width="2"/>
<text x="960" y="240" dominant-baseline="text-before-edge" font-family="Arial,DejaVu Sans,sans-serif" font-size="24" font-weight="700" fill="#f1f5f9">3 · Simulated payment</text>
<text x="955" y="278" dominant-baseline="text-before-edge" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#a7b8ce">Orders → Payment</text>
<text x="955" y="306" dominant-baseline="text-before-edge" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#a7b8ce">Authorize, then capture</text>
<rect x="1360" y="220" width="370" height="140" rx="14" fill="#111f33" stroke="#71d6ff" stroke-width="2"/>
<rect x="1375" y="239" width="4" height="26" rx="1" fill="#71d6ff" stroke="#71d6ff" stroke-width="2"/>
<text x="1390" y="240" dominant-baseline="text-before-edge" font-family="Arial,DejaVu Sans,sans-serif" font-size="24" font-weight="700" fill="#f1f5f9">4 · Confirm order</text>
<text x="1385" y="278" dominant-baseline="text-before-edge" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#a7b8ce">Orders saves CONFIRMED</text>
<text x="1385" y="306" dominant-baseline="text-before-edge" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#a7b8ce">Return to shopper</text>
