<rect x="70" y="425" width="800" height="165" rx="14" fill="#111f33" stroke="#ffcc6b" stroke-width="2"/>
<rect x="85" y="444" width="4" height="26" rx="1" fill="#ffcc6b" stroke="#ffcc6b" stroke-width="2"/>
<text x="100" y="445" dominant-baseline="text-before-edge" font-family="Arial,DejaVu Sans,sans-serif" font-size="26" font-weight="700" fill="#f1f5f9">Failure path · tested scenario to demonstrate</text>
<text x="95" y="483" dominant-baseline="text-before-edge" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#a7b8ce">Payment method &quot;decline&quot; → order marked FAILED</text>
<text x="95" y="511" dominant-baseline="text-before-edge" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#a7b8ce">Orders attempts inventory release and emits order.failed</text>
<text x="95" y="539" dominant-baseline="text-before-edge" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#a7b8ce">Failure compensation is best effort; reconciliation is a future task</text>
<rect x="920" y="425" width="800" height="165" rx="14" fill="#111f33" stroke="#ffcc6b" stroke-width="2"/>
<rect x="935" y="444" width="4" height="26" rx="1" fill="#ffcc6b" stroke="#ffcc6b" stroke-width="2"/>
<text x="950" y="445" dominant-baseline="text-before-edge" font-family="Arial,DejaVu Sans,sans-serif" font-size="26" font-weight="700" fill="#f1f5f9">Cancellation path</text>
<text x="945" y="483" dominant-baseline="text-before-edge" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#a7b8ce">Request refund if paymentId exists; attempt stock release</text>
<text x="945" y="511" dominant-baseline="text-before-edge" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#a7b8ce">Save CANCELLED and emit order.cancelled</text>
<text x="945" y="539" dominant-baseline="text-before-edge" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#a7b8ce">Payment and order writes are not one distributed transaction</text>
<rect x="45" y="645" width="1710" height="415" rx="18" fill="#0c1829" stroke="#334761" stroke-width="2"/>
<text x="67" y="663" dominant-baseline="text-before-edge" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" font-weight="700" fill="#a7b8ce">ASYNCHRONOUS PATH  /  One Kafka-compatible topic; independent consumer groups</text>
<rect x="70" y="710" width="780" height="120" rx="14" fill="#111f33" stroke="#ffcc6b" stroke-width="2"/>
<rect x="85" y="729" width="4" height="26" rx="1" fill="#ffcc6b" stroke="#ffcc6b" stroke-width="2"/>
<text x="100" y="730" dominant-baseline="text-before-edge" font-family="Arial,DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#f1f5f9">Producers: Catalog, Inventory, Orders, Payment</text>
<text x="95" y="768" dominant-baseline="text-before-edge" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#a7b8ce">Plus Notification publishes notification.sent</text>
<text x="95" y="796" dominant-baseline="text-before-edge" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#a7b8ce">Event envelope: id, type, source, occurredAt, data</text>
<rect x="1020" y="710" width="700" height="120" rx="14" fill="#111f33" stroke="#ffcc6b" stroke-width="2"/>
<rect x="1035" y="729" width="4" height="26" rx="1" fill="#ffcc6b" stroke="#ffcc6b" stroke-width="2"/>
<text x="1050" y="730" dominant-baseline="text-before-edge" font-family="Arial,DejaVu Sans,sans-serif" font-size="24" font-weight="700" fill="#f1f5f9">Redpanda / commerce.domain-events</text>
<text x="1045" y="768" dominant-baseline="text-before-edge" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#a7b8ce">Consumer groups: notification-service + analytics-service</text>
<text x="1045" y="796" dominant-baseline="text-before-edge" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#a7b8ce">Local Compose broker has no persistent volume</text>
