<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200" role="img" aria-labelledby="title desc">
<title id="title">Checkout, compensation and domain events</title>
<desc id="desc">Synchronous checkout coordinates independent databases; asynchronous consumers build notifications and analytics. CURRENT APPLICATION FLOW  |  Publishing is best effort; this design does not provide atomic database + event commits.</desc>
<rect width="1800" height="1200" fill="#08111f"/>
<rect x="56" y="42" width="6" height="92" rx="0" fill="#71d6ff" stroke="#71d6ff" stroke-width="2"/>
<text x="82" y="44" dominant-baseline="text-before-edge" font-family="Arial,DejaVu Sans,sans-serif" font-size="16" font-weight="700" fill="#71d6ff">ATELIER OBJECTS  /  COMMERCE PLATFORM</text>
<text x="80" y="76" dominant-baseline="text-before-edge" font-family="Arial,DejaVu Sans,sans-serif" font-size="40" font-weight="700" fill="#f1f5f9">Checkout, compensation and domain events</text>
<text x="80" y="132" dominant-baseline="text-before-edge" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#a7b8ce">Synchronous checkout coordinates independent databases; asynchronous consumers build notifications and analytics</text>
