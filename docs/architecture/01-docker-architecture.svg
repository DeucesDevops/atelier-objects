<text x="70" y="1060" dominant-baseline="text-before-edge" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#a7b8ce">Persistent today: PostgreSQL only. Notification delivery history is memory-only. Event and recovery paths are shown separately.</text>
